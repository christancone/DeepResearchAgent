[project]
name = "src"
version = "0.1.0"
description = "DeepResearchAgent"
authors = [
    {name = "Skywork"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
[tool.poetry.dependencies]
python-dotenv = ">=1.0.1"
rich = ">=13.9.4"
litellm = ">=1.64.1"
openai = ">=1.90.0"
pillow = ">=10.4.0"
numpy = ">=2.2.4"
pynput = ">=1.8.1"
transformers = ">=4.50.1"
markdownify = ">=1.1.0"
duckduckgo-search = ">=7.5.4"
mammoth = ">=1.9.0"
pandas = ">=2.2.3"
pdfminer-six = ">=20250327"
python-pptx = ">=1.0.2"
puremagic = ">=1.28"
pydub = ">=0.25.1"
speechrecognition = ">=3.14.2"
pathvalidate = ">=3.2.3"
serpapi = ">=0.1.5"
google-search-results = ">=2.4.2"
# datasets = ">=3.5.0"  # Commented - causes resolution issues, not needed for core functionality
anthropic = ">=0.49.0"
openpyxl = ">=3.1.5"
xlsxwriter = ">=3.2.4"  # 3.2.3 is yanked
baidusearch = ">=1.0.3"
patchright = ">=1.51.3"
pyautogui = ">=0.9.54"
json5 = ">=0.12.0"
tenacity = ">=9.1.2"
crawl4ai = ">=0.6.3"
camelot-py = ">=1.0.0"
xlrd = ">=2.0.1"
toml = ">=0.10.2"
googlesearch-python = ">=1.3.0"
fastmcp = ">=2.8.1"
mmengine = ">=0.10.7"
asyncpg = ">=0.29.0"
tiktoken = ">=0.8.0"
pydantic = ">=2.10.0"
pyyaml = ">=6.0"
requests = ">=2.31.0"
beautifulsoup4 = ">=4.12.0"
huggingface_hub = ">=0.34.0"
httpx = ">=0.28.0"
aiohttp = ">=3.9.0"
langchain-openai = ">=0.3.0"
langchain-core = ">=0.3.0"
typing_extensions = ">=4.12.0"
inflection = ">=0.5.1"
firecrawl-py = ">=0.0.16"
httpx_aiohttp = ">=0.1.6"
